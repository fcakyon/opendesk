services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: opendesk
      POSTGRES_DB: opendesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendesk -d opendesk"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  opendesk:
    build:
      context: .
      dockerfile: deploy/docker/opendesk.Dockerfile
    restart: unless-stopped
    environment:
      OPENDESK_ENV: production
      OPENDESK_ROLE: all
      SERVE_WEB: "true"
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      API_URL: https://desk.akyonlabs.com
      APP_URL: https://desk.akyonlabs.com
      GATEWAY_URL: wss://desk.akyonlabs.com/socket
      CORS_ORIGINS: https://desk.akyonlabs.com
      SITE_URL: https://desk.akyonlabs.com
      TRUST_PROXY: "false"
      TRUSTED_PROXY_HOPS: "1"
      DATABASE_URL: postgres://opendesk:${POSTGRES_PASSWORD:?required}@postgres:5432/opendesk?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:?required}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?required}
      NATS_LISTEN: 0.0.0.0:4222
      NATS_TOKEN: ${NATS_TOKEN:?required}
      INBOUND_SECRET: ${INBOUND_SECRET:?required}
      STORAGE_DRIVER: local
      MAIL_DRIVER: smtp
      MAIL_FROM: AkyonLabs Team <noreply@akyonlabs.com>
      SMTP_HOST: email-smtp.eu-north-1.amazonaws.com
      SMTP_PORT: "2587"
      SMTP_TLS: starttls
      SMTP_USERNAME: ${SMTP_USERNAME:?required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?required}
    volumes:
      - opendesk-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  realtime:
    build:
      context: .
      dockerfile: deploy/docker/realtime.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      PHX_HOST: desk.akyonlabs.com
      AUTH_SECRET: ${AUTH_SECRET:?required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?required}
      NATS_URL: nats://opendesk:4222
      NATS_TOKEN: ${NATS_TOKEN:?required}
      CHECK_ORIGINS: https://desk.akyonlabs.com
      TRUSTED_PROXY_HOPS: "1"
    depends_on:
      opendesk:
        condition: service_healthy

  proxy:
    build: ./deploy/openship
    restart: unless-stopped
    ports: ["80"]
    depends_on:
      opendesk:
        condition: service_healthy
      realtime:
        condition: service_healthy

volumes:
  postgres-data:
  opendesk-data:
