name: Sync Upstream

# Scheduled workflows run from the default branch, so this lives on fatih/openship.
# It fast-forwards main to useopendesk/opendesk:main and never adds commits to main.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'fcakyon/opendesk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Fast-forward main to useopendesk/opendesk
        run: |
          git fetch https://github.com/useopendesk/opendesk.git main
          git push origin FETCH_HEAD:refs/heads/main || {
            echo "::error::Push failed. If upstream changed .github/workflows/*, add an UPSTREAM_SYNC_TOKEN repo secret (repo + workflow scopes). Otherwise main has diverged from upstream."
            exit 1
          }
